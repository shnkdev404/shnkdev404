<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Shshank: Embedded Systems, Robotics, GIS">
<style>
.p{transform:translateY(150px);animation:peek 24s cubic-bezier(.3,.9,.4,1) infinite}
.b{animation-delay:4s}
.bob{animation:bob 1.3s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s linear infinite}
.wx{transform:translateX(-80px);animation:wx 24s linear infinite}
.wy{animation:wy 24s ease-in-out infinite}
.wad{animation:wad .5s ease-in-out infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:l1 24s ease-in-out infinite}
.l2{animation-name:l2}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 3.2s ease-in-out infinite}
.ty{animation:ty 24s linear infinite}
.cur{animation:cur 1s steps(1) infinite}
@keyframes peek{0%,1%{transform:translateY(150px)}3.5%{transform:translateY(-8px)}5%,13%{transform:translateY(0)}16%,100%{transform:translateY(150px)}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
@keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes cur{0%{opacity:1}50%{opacity:0}}
