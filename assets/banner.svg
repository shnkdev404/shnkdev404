<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Shshank: Embedded Systems, Robotics, GIS">
<style>
.p{transform:translateY(150px);animation:peek 20s cubic-bezier(.3,.9,.4,1) infinite}
.b{animation-delay:4s}
.bob{animation:bob 1.3s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s linear infinite}
.cur{animation:cur 1s steps(1) infinite}
.sit{transform:translateX(290px);animation:sit 20s cubic-bezier(.3,.9,.4,1) infinite}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:swing 1.6s ease-in-out infinite alternate}
.l2{animation-delay:-1.6s}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 3.2s ease-in-out infinite}
@keyframes peek{0%{transform:translateY(150px)}3%{transform:translateY(-8px)}5%,14%{transform:translateY(0)}18%,100%{transform:translateY(150px)}}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,42%,48%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}
@keyframes cur{0%{opacity:1}50%{opacity:0}}
@keyframes sit{0%,40%{transform:translateX(290px)}47%{transform:translateX(-10px)}50%,92%{transform:translateX(0)}98%,100%{transform:translateX(290px)}}
@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes nod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.p,.bob,.eye,.cur,.sit,.leg,.nod{animation:none}.sit{transform:none}}
</style>
<defs><clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#12324a"/></pattern></defs>
<g clip-path="url(#c)">
<rect width="1200" height="300" fill="#0a1624"/><rect width="1200" height="300" fill="url(#g)"/>
<g transform="translate(0,150) rotate(90)"><g class="p a"><g class="bob">
<line x1="0" y1="-90" x2="0" y2="-108" stroke="#7fe3f5" stroke-width="5" stroke-linecap="round"/>
<rect x="-9" y="-122" width="18" height="18" rx="5" fill="#ffd166"/>
<rect x="-88" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/><rect x="72" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/>
<rect x="-76" y="-90" width="152" height="150" rx="30" fill="#00b4d8"/>
<rect x="-76" y="-90" width="152" height="26" rx="13" fill="#48cae4" opacity=".6"/>
<rect x="-56" y="-62" width="112" height="50" rx="20" fill="#06202b"/>
<rect class="eye" x="-36" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
<rect class="eye" x="20" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
</g></g></g>
<g transform="translate(930,0) rotate(180)"><g class="p b"><g class="bob">
<line x1="0" y1="-90" x2="0" y2="-108" stroke="#7fe3f5" stroke-width="5" stroke-linecap="round"/>
<rect x="-9" y="-122" width="18" height="18" rx="5" fill="#ffd166"/>
<rect x="-88" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/><rect x="72" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/>
<rect x="-76" y="-90" width="152" height="150" rx="30" fill="#00b4d8"/>
<rect x="-76" y="-90" width="152" height="26" rx="13" fill="#48cae4" opacity=".6"/>
<rect x="-56" y="-62" width="112" height="50" rx="20" fill="#06202b"/>
<rect class="eye" x="-36" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
<rect class="eye" x="20" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
</g></g></g>
<text x="600" y="150" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#ffffff">Shshank</text>
<text x="600" y="200" text-anchor="middle" font-family="Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace" font-size="24" fill="#48cae4" xml:space="preserve">Embedded Systems / Robotics / GIS<tspan class="cur" fill="#ffd166"> _</tspan></text>
<g class="sit"><g transform="translate(1090,206) scale(.75)">
<g class="leg"><rect x="-34" y="-6" width="20" height="62" rx="10" fill="#0f7f9c"/><rect x="-40" y="48" width="32" height="18" rx="9" fill="#48cae4"/></g>
<g class="leg l2"><rect x="14" y="-6" width="20" height="62" rx="10" fill="#0f7f9c"/><rect x="8" y="48" width="32" height="18" rx="9" fill="#48cae4"/></g>
<rect x="-72" y="-64" width="18" height="60" rx="9" fill="#0f7f9c"/><rect x="54" y="-64" width="18" height="60" rx="9" fill="#0f7f9c"/>
<rect x="-52" y="-84" width="104" height="88" rx="26" fill="#00b4d8"/>
<rect x="-26" y="-62" width="52" height="34" rx="10" fill="#06202b"/>
<circle cx="-12" cy="-45" r="5" fill="#ffd166"/><circle cx="2" cy="-45" r="5" fill="#48cae4"/><circle cx="16" cy="-45" r="5" fill="#e6fbff"/>
<g class="nod"><g transform="translate(0,-135) scale(.85)">
<line x1="0" y1="-90" x2="0" y2="-108" stroke="#7fe3f5" stroke-width="5" stroke-linecap="round"/>
<rect x="-9" y="-122" width="18" height="18" rx="5" fill="#ffd166"/>
<rect x="-88" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/><rect x="72" y="-52" width="16" height="44" rx="6" fill="#0f7f9c"/>
<rect x="-76" y="-90" width="152" height="150" rx="30" fill="#00b4d8"/>
<rect x="-76" y="-90" width="152" height="26" rx="13" fill="#48cae4" opacity=".6"/>
<rect x="-56" y="-62" width="112" height="50" rx="20" fill="#06202b"/>
<rect class="eye" x="-36" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
<rect class="eye" x="20" y="-50" width="16" height="26" rx="8" fill="#e6fbff"/>
</g><rect x="-60" y="-212" width="120" height="128" fill="none"/></g>
</g></g>
<rect x="985" y="206" width="215" height="10" fill="#12324a"/><rect x="985" y="206" width="215" height="2" fill="#1d4d6b"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#12324a" stroke-width="1.5"/>
</svg>
