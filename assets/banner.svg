@keyframes l2{0.000%{transform:rotate(0deg)}33.333%{transform:rotate(0deg)}34.375%{transform:rotate(-24deg)}35.417%{transform:rotate(24deg)}36.458%{transform:rotate(-24deg)}37.500%{transform:rotate(24deg)}38.542%{transform:rotate(-24deg)}39.583%{transform:rotate(24deg)}40.625%{transform:rotate(-24deg)}41.667%{transform:rotate(24deg)}42.708%{transform:rotate(-24deg)}43.750%{transform:rotate(24deg)}44.792%{transform:rotate(-24deg)}45.833%{transform:rotate(24deg)}46.875%{transform:rotate(-24deg)}47.917%{transform:rotate(24deg)}48.958%{transform:rotate(-24deg)}50.000%{transform:rotate(24deg)}51.042%{transform:rotate(-24deg)}52.083%{transform:rotate(24deg)}53.125%{transform:rotate(-24deg)}54.167%{transform:rotate(24deg)}56.250%{transform:rotate(0deg)}59.583%{transform:rotate(-16deg)}62.917%{transform:rotate(16deg)}66.250%{transform:rotate(-16deg)}69.583%{transform:rotate(16deg)}72.917%{transform:rotate(-16deg)}75.000%{transform:rotate(0deg)}76.042%{transform:rotate(-24deg)}77.083%{transform:rotate(24deg)}78.125%{transform:rotate(-24deg)}79.167%{transform:rotate(24deg)}80.208%{transform:rotate(-24deg)}81.250%{transform:rotate(24deg)}82.292%{transform:rotate(-24deg)}83.333%{transform:rotate(24deg)}84.375%{transform:rotate(-24deg)}85.833%{transform:rotate(0deg)}100.000%{transform:rotate(0deg)}}
@keyframes ty{0%,2%{transform:translateX(0);animation-timing-function:steps(33)}14%,96%{transform:translateX(480px);animation-timing-function:steps(8)}99%,100%{transform:translateX(0)}}
