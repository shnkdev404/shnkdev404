  <path d="M416 222 Q443 187 489 181 Q528 176 555 179" fill="none" stroke="#77797a" stroke-width="3" opacity=".13"/>
  <!-- cyan pixel-style eyes -->
  <path d="M428 299 L428 291 L431 291 L431 284 L435 284 L435 279 L441 279 L441 275 L450 275 L450 272 L474 272 L474 275 L484 275 L484 278 L492 278 L492 283 L498 283 L498 289 L503 289 L503 298 L508 298 L508 309 L501 309 L501 323 L489 323 L489 320 L477 320 L477 322 L454 322 L454 319 L443 319 L443 316 L435 316 L435 310 L430 310 L430 304 L428 304Z" fill="#18d9f5"/>
  <path d="M556 299 L556 291 L560 291 L560 284 L565 284 L565 279 L572 279 L572 275 L582 275 L582 272 L605 272 L605 275 L614 275 L614 278 L622 278 L622 284 L628 284 L628 291 L633 291 L633 299 L638 299 L638 309 L631 309 L631 316 L624 316 L624 320 L614 320 L614 323 L590 323 L590 320 L578 320 L578 322 L566 322 L566 318 L560 318 L560 311 L556 311Z" fill="#18d9f5"/>
  <path d="M434 291 L436 285 L443 280 M563 291 L567 285 L574 280" fill="none" stroke="#a4faff" stroke-width="2" opacity=".55"/>
  <!-- logo and tiny indicator -->
  <text x="550" y="560" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="400" fill="#444648" letter-spacing=".5">Eilik</text>
  <ellipse cx="465" cy="627" rx="4" ry="5" fill="#7d8283"/>
  <ellipse cx="464" cy="626" rx="1.2" ry="2" fill="#c6caca"/>
  <!-- narrow sole above platform -->
  <path d="M473 867 Q536 874 598 867 L591 873 Q536 878 478 873Z" fill="#4c5051" opacity=".72"/>
</svg>
