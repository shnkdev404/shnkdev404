  <path d="M337 219 Q344 134 402 91 Q453 61 536 61 Q622 62 671 99 Q724 139 734 225 L750 268 Q759 287 748 306 L728 331 Q719 383 689 414 Q654 447 593 441 L476 441 Q409 440 375 414 Q344 390 333 341 L316 315 Q302 293 316 268Z" fill="url(#shell)" filter="url(#drop)"/>
