<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1075" height="1075" viewBox="0 0 1075 1075" role="img" aria-labelledby="title desc">
  <title id="title">Eilik robot</title>
  <desc id="desc">Editable vector reconstruction of a white Eilik robot with a black screen face, cyan eyes, teal accents, and circular stand.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="40%" r="78%"><stop stop-color="#fff"/><stop offset="1" stop-color="#fdfdfd"/></radialGradient>
    <linearGradient id="shell" x1="0" x2="1" y1="0" y2=".15"><stop stop-color="#d9dcdd"/><stop offset=".16" stop-color="#f8f8f8"/><stop offset=".52" stop-color="#fff"/><stop offset=".82" stop-color="#f3f4f4"/><stop offset="1" stop-color="#c9cdce"/></linearGradient>
    <linearGradient id="shellVertical" x1="0" x2=".18" y1="0" y2="1"><stop stop-color="#fafafa"/><stop offset=".5" stop-color="#f4f5f5"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#dfe2e2"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#7be5dc"/><stop offset=".45" stop-color="#56c9c2"/><stop offset="1" stop-color="#a4ded9"/></linearGradient>
    <linearGradient id="armTeal" x1="0" x2="1" y1=".4" y2=".55"><stop stop-color="#d5e8e6"/><stop offset=".25" stop-color="#a7ceca"/><stop offset=".75" stop-color="#9bcac6"/><stop offset="1" stop-color="#e5eeee"/></linearGradient>
    <radialGradient id="face" cx="47%" cy="32%" r="72%"><stop stop-color="#303132"/><stop offset=".6" stop-color="#18191a"/><stop offset="1" stop-color="#08090a"/></radialGradient>
    <linearGradient id="base" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff"/><stop offset=".33" stop-color="#f2f4f4"/><stop offset="1" stop-color="#dadddd"/></linearGradient>
    <filter id="shadow" x="-.4" y="-.5" width="1.8" height="2"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="soft" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="2.3"/></filter>
    <filter id="drop" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/><feOffset dy="3"/><feComponentTransfer><feFuncA type="linear" slope=".17"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1075" height="1075" fill="url(#bg)"/>
  <!-- soft product shadow -->
  <ellipse cx="535" cy="927" rx="363" ry="40" fill="#7c8180" opacity=".20" filter="url(#shadow)"/>
  <ellipse cx="548" cy="850" rx="314" ry="18" fill="#858a88" opacity=".16" filter="url(#soft)"/>
  <!-- round display platform -->
  <path d="M190 858 Q191 842 222 836 Q530 794 851 836 Q881 840 883 858 L883 906 Q882 925 854 931 Q539 970 218 932 Q190 928 190 909Z" fill="url(#base)" stroke="#d5d9d9" stroke-width="2"/>
  <ellipse cx="536" cy="858" rx="346" ry="29" fill="#fafbfb" stroke="#e4e7e7" stroke-width="2"/>
  <path d="M193 875 Q535 913 880 875" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
  <path d="M878 869 Q886 874 884 889 L881 889 L878 883Z" fill="#d1d5d5"/>
  <!-- raised left arm behind body -->
